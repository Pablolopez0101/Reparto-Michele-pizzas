<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Michele Pizzas · Reparto a panaderías</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Michele Pizzas">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --crust:#1C1410;
    --crust-2:#2A1F17;
    --flour:#FAF6EC;
    --paper:#FFFFFF;
    --tomato:#C1272D;
    --tomato-dark:#98151A;
    --basil:#4A7856;
    --basil-dark:#365C40;
    --tan:#C89B6C;
    --ink:#2B2118;
    --ink-soft:#6B5D4F;
    --line:#E7DFCF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--flour);color:var(--ink);font-family:'Space Grotesk',sans-serif;}
  body{padding-bottom:92px;min-height:100vh;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  ::selection{background:var(--tan);color:var(--crust);}

  /* Header */
  .app-header{
    background:linear-gradient(180deg,var(--crust) 0%,var(--crust-2) 100%);
    color:var(--flour);
    padding:22px 20px 26px;
    position:sticky;top:0;z-index:20;
    border-bottom:3px solid var(--tomato);
  }
  .app-header .eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tan);font-weight:600;
  }
  .app-header h1{
    font-size:26px;font-weight:600;font-style:italic;margin:2px 0 0;letter-spacing:.01em;
  }
  .brand-row{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:54px;height:54px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));}
  .brand-row h1{font-size:23px;}
  .brand-row .eyebrow{margin-bottom:1px;}
  .header-stats{
    display:flex;gap:10px;margin-top:14px;
  }
  .hstat{
    background:rgba(250,246,236,0.07);
    border:1px solid rgba(250,246,236,0.14);
    border-radius:10px;
    padding:8px 12px;
    flex:1;
  }
  .hstat .n{font-family:'Fraunces',serif;font-size:20px;font-weight:600;line-height:1;}
  .hstat .l{font-size:10.5px;color:var(--tan);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}

  main{max-width:560px;margin:0 auto;padding:18px 16px 10px;}

  /* Section titles */
  .section-title{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:22px 0 12px;
  }
  .section-title:first-child{margin-top:4px;}
  .section-title h2{font-size:17px;font-weight:600;margin:0;}
  .section-title .count{
    font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);
    padding:2px 9px;border-radius:99px;font-weight:500;
  }

  .empty{
    text-align:center;padding:36px 20px;color:var(--ink-soft);
    background:var(--paper);border:1.5px dashed var(--line);border-radius:14px;font-size:14px;
  }
  .empty .big{font-size:28px;display:block;margin-bottom:8px;}

  /* Ticket card (pedido pendiente) */
  .ticket{
    background:var(--paper);
    border-radius:4px 4px 12px 12px;
    margin-bottom:16px;
    position:relative;
    box-shadow:0 2px 10px rgba(28,20,16,0.07), 0 1px 2px rgba(28,20,16,0.05);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .ticket::before{
    content:"";
    display:block;height:7px;width:100%;
    background:repeating-linear-gradient(90deg,var(--flour) 0 6px, transparent 6px 13px), var(--tomato);
  }
  .ticket.done::before{ background:repeating-linear-gradient(90deg,var(--flour) 0 6px, transparent 6px 13px), var(--basil); }
  .ticket-body{padding:14px 16px 15px;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ticket-num{font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:.04em;}
  .bakery-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:2px 0 1px;line-height:1.15;}
  .bakery-addr{font-size:12.5px;color:var(--ink-soft);}
  .badge{
    font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:4px 9px;border-radius:99px;white-space:nowrap;
  }
  .badge.pend{background:#FCE9E8;color:var(--tomato-dark);}
  .badge.done{background:#E7F0E6;color:var(--basil-dark);}

  .item-list{margin:12px 0 4px;border-top:1px dashed var(--line);padding-top:10px;}
  .item-row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;}
  .item-row .qty{color:var(--tomato-dark);font-weight:600;margin-right:6px;}
  .item-row .price{color:var(--ink-soft);}

  .ticket-total{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  }
  .ticket-total .lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .ticket-total .val{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}

  .pay-tag{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:11.5px;font-weight:600;color:var(--ink-soft);
    background:var(--flour);border:1px solid var(--line);padding:3px 10px;border-radius:99px;
  }
  .ticket-actions{display:flex;gap:8px;margin-top:12px;}
  .btn{
    border:none;border-radius:9px;padding:10px 14px;font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--basil);color:#fff;flex:1;}
  .btn-primary:hover{background:var(--basil-dark);}
  .btn-ghost{background:var(--flour);color:var(--ink);border:1px solid var(--line);}
  .btn-danger-ghost{background:transparent;color:var(--tomato-dark);border:1px solid #EBCFCE;}
  .btn-map{background:var(--crust);color:var(--flour);}
  .btn-map:hover{background:var(--crust-2);}

  /* Rutas */
  .route-list{position:relative;padding-left:6px;}
  .route-stop{
    display:flex;gap:12px;position:relative;padding-bottom:20px;
  }
  .route-stop:last-child{padding-bottom:2px;}
  .route-stop::before{
    content:"";position:absolute;left:15px;top:34px;bottom:-4px;width:2px;
    background:repeating-linear-gradient(0deg,var(--tan) 0 4px, transparent 4px 8px);
  }
  .route-stop:last-child::before{display:none;}
  .stop-num{
    flex-shrink:0;width:32px;height:32px;border-radius:50%;
    background:var(--crust);color:var(--tan);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:14px;z-index:1;
  }
  .stop-card{
    flex:1;background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-top:-2px;
  }
  .stop-name{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .stop-addr{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .stop-meta{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .stop-actions{margin-top:10px;display:flex;gap:8px;}

  /* Historial */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .stat-card{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  }
  .stat-card .n{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}
  .stat-card .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .stat-card.wide{grid-column:1/-1;}

  .type-breakdown{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px;}
  .tb-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .tb-row .tb-name{width:110px;font-size:12.5px;font-weight:600;flex-shrink:0;}
  .tb-row .tb-bar-wrap{flex:1;background:var(--flour);border-radius:99px;height:8px;overflow:hidden;}
  .tb-row .tb-bar{height:100%;background:var(--tomato);border-radius:99px;}
  .tb-row .tb-val{width:34px;text-align:right;font-size:12px;color:var(--ink-soft);flex-shrink:0;}

  .search-bar{margin-bottom:10px;}
  .search-bar input{
    width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--line);
    font-family:'Space Grotesk',sans-serif;font-size:14px;background:var(--paper);color:var(--ink);
  }
  .search-bar input:focus{outline:none;border-color:var(--tan);}
  .chip-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);
    padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;
    white-space:nowrap;font-family:'Space Grotesk',sans-serif;
  }
  .chip.active{background:var(--crust);color:var(--flour);border-color:var(--crust);}
  .result-count{font-size:12px;color:var(--ink-soft);font-weight:600;margin:0 0 10px 2px;}
  .hist-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .hist-bottom .pay-tag{margin-top:0;}
  .day-group{margin-bottom:18px;}
  .day-label{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
    margin:0 0 8px 2px;
  }
  .hist-card{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
  }
  .hist-top{display:flex;justify-content:space-between;align-items:baseline;}
  .hist-name{font-weight:600;font-size:14.5px;}
  .hist-time{font-size:11px;color:var(--ink-soft);}
  .hist-items{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .hist-total{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin-top:0;color:var(--basil-dark);}

  /* Bottom nav */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--crust);border-top:1px solid rgba(250,246,236,0.1);
    display:flex;align-items:center;justify-content:space-around;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    background:none;border:none;color:rgba(250,246,236,0.55);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;
    padding:6px 14px;border-radius:10px;cursor:pointer;letter-spacing:.02em;
  }
  .nav-btn .ic{font-size:19px;}
  .nav-btn.active{color:var(--flour);background:rgba(250,246,236,0.08);}
  .nav-fab{
    background:var(--tomato);color:#fff;border:none;border-radius:50%;
    width:52px;height:52px;font-size:26px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(193,39,45,0.45);cursor:pointer;flex-shrink:0;
    transform:translateY(-14px);
  }
  .nav-fab:active{transform:translateY(-14px) scale(0.94);}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(28,20,16,0.55);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--flour);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px;}
  .modal h3{font-size:19px;margin:0 0 14px;font-weight:600;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field input, .field select{
    width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);
    font-family:'Space Grotesk',sans-serif;font-size:14.5px;background:var(--paper);color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--tan);}
  .item-editor{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .item-editor-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:7px;align-items:end;margin-bottom:8px;}
  .item-editor-row:last-child{margin-bottom:0;}
  .rm-item{background:none;border:none;color:var(--tomato-dark);font-size:18px;cursor:pointer;padding:8px 4px;}
  .add-item-btn{
    width:100%;background:none;border:1.5px dashed var(--tan);color:var(--crust);border-radius:9px;
    padding:9px;font-weight:600;font-size:13px;cursor:pointer;margin-top:2px;
  }
  .modal-submit-row{display:flex;gap:10px;margin-top:16px;}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--crust);color:var(--flour);padding:10px 18px;border-radius:99px;
    font-size:13px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .collapsible-head{
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;
    padding:10px 2px;
  }
  .collapsible-head .chev{transition:transform .2s ease;color:var(--ink-soft);}
  .collapsible-head.open .chev{transform:rotate(180deg);}
  .collapsible-body{display:none;}
  .collapsible-body.open{display:block;}

  .loading-screen{
    position:fixed;inset:0;background:var(--flour);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  .loading-screen .spin{
    width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--tomato);
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

        <input type="text" id="fAddress" placeholder="Ej. Carrer Major 12, Vic" required>
      </div>
      <div class="field">
        <label>Forma de pago</label>
        <select id="fPayment"></select>
      </div>
      <label style="display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;">Pizzas del pedido</label>
      <div id="itemsEditor"></div>
      <button type="button" class="add-item-btn" id="addItemBtn">+ Añadir tipo de pizza</button>
      <div class="modal-submit-row">
        <button type="button" class="btn btn-ghost" id="cancelModalBtn" style="flex:1;">Cancelar</button>
        <button type="submit" class="btn btn-primary" style="flex:1;">Guardar pedido</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const PIZZA_TYPES = [
    {name:'Margarita', price:7.5},
    {name:'Pepperoni', price:8.5},
    {name:'Cuatro Quesos', price:9},
    {name:'Napolitana', price:8},
    {name:'Hawaiana', price:8.5},
    {name:'Vegetariana', price:8},
    {name:'Bacon y Cebolla', price:9},
    {name:'Otra', price:7.5}
  ];
  const PAYMENT_METHODS = [
    {name:'Efectivo', icon:'💶'},
    {name:'Tarjeta', icon:'💳'},
    {name:'Bizum', icon:'📲'},
    {name:'Transferencia', icon:'🏦'},
    {name:'Pendiente de pago', icon:'⏳'}
  ];
  const STORAGE_KEY = 'pizza-orders';
  let orders = [];
  let currentTab = 'pedidos';
  let deliveredCollapsed = true;
  let itemRowCount = 0;
  let histSearch = '';
  let histPaymentFilter = 'Todas';

  const $ = sel => document.querySelector(sel);
  const money = n => (Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
  const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function uid(){ return 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  async function loadOrders(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      orders = raw ? JSON.parse(raw) : [];
    }catch(e){
      orders = [];
    }
  }
  async function saveOrders(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
    }catch(e){
      showToast('No se pudo guardar. Revisa el almacenamiento del navegador.');
    }
  }

  function orderTotal(o){ return o.items.reduce((s,i)=> s + i.unidades*i.precio, 0); }
  function orderUnits(o){ return o.items.reduce((s,i)=> s + Number(i.unidades), 0); }
  function paymentIcon(name){
    const m = PAYMENT_METHODS.find(p=>p.name===name);
    return m ? m.icon : '💶';
  }

  function showToast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 1800);
  }

  /* ---------- RENDER: HEADER STATS ---------- */
  function renderHeaderStats(){
    const pending = orders.filter(o=>o.status==='pendiente');
    const bakeries = new Set(pending.map(o=>o.bakery)).size;
    const unitsToday = orders.filter(o=> o.status==='entregado' && isToday(o.deliveredAt))
      .reduce((s,o)=> s+orderUnits(o), 0);
    $('#headerStats').innerHTML = `
      <div class="hstat"><div class="n">${pending.length}</div><div class="l">Pedidos pend.</div></div>
      <div class="hstat"><div class="n">${bakeries}</div><div class="l">Panaderías</div></div>
      <div class="hstat"><div class="n">${unitsToday}</div><div class="l">Pizzas hoy</div></div>
    `;
  }

  function isToday(iso){
    if(!iso) return false;
    const d = new Date(iso), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  }
  function fmtDayLabel(iso){
    const d = new Date(iso);
    if(isToday(iso)) return 'Hoy · ' + d.toLocaleDateString('es-ES',{day:'2-digit',month:'long'});
    return d.toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long'});
  }

  /* ---------- RENDER: PEDIDOS TAB ---------- */
  function renderPedidos(){
    const pending = orders.filter(o=>o.status==='pendiente')
      .sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt));
    const deliveredToday = orders.filter(o=> o.status==='entregado' && isToday(o.deliveredAt))
      .sort((a,b)=> new Date(b.deliveredAt) - new Date(a.deliveredAt));

    let html = '<div class="section-title"><h2>Por servir</h2><span class="count">' + pending.length + '</span></div>';

    if(pending.length===0){
      html += `<div class="empty"><span class="big">🥐</span>No hay pedidos pendientes.<br>Todas las panaderías están servidas.</div>`;
    } else {
      pending.forEach((o,idx)=>{
        html += ticketCard(o, idx+1);
      });
    }

    if(deliveredToday.length>0){
      html += `<div class="collapsible-head ${deliveredCollapsed?'':'open'}" id="deliveredToggle">
        <h2 style="font-size:15px;margin:0;color:var(--ink-soft);">Entregados hoy (${deliveredToday.length})</h2>
        <span class="chev">▾</span>
      </div>
      <div class="collapsible-body ${deliveredCollapsed?'':'open'}" id="deliveredBody">`;
      deliveredToday.forEach((o,idx)=>{ html += ticketCard(o, null); });
      html += `</div>`;
    }

    $('#mainContent').innerHTML = html;

    $('#deliveredToggle')?.addEventListener('click', ()=>{
      deliveredCollapsed = !deliveredCollapsed;
      renderPedidos();
    });
    bindTicketActions();
  }

  function ticketCard(o, stopNum){
    const total = orderTotal(o);
    const isDone = o.status==='entregado';
    const itemsHtml = o.items.map(i => `
      <div class="item-row">
        <span><span class="qty">${i.unidades}×</span>${esc(i.tipo)}</span>
        <span class="price">${money(i.unidades*i.precio)}</span>
      </div>`).join('');
    return `
      <div class="ticket ${isDone?'done':''}" data-id="${o.id}">
        <div class="ticket-body">
          <div class="ticket-top">
            <div>
              <div class="ticket-num">${stopNum? 'PARADA #'+String(stopNum).padStart(2,'0') : 'PEDIDO'}</div>
              <div class="bakery-name">${esc(o.bakery)}</div>
              <div class="bakery-addr">📍 ${esc(o.address)}</div>
            </div>
            <span class="badge ${isDone?'done':'pend'}">${isDone?'Entregado':'Pendiente'}</span>
          </div>
          <div class="item-list">${itemsHtml}</div>
          <div class="ticket-total">
            <span class="lbl">Total pedido</span>
            <span class="val">${money(total)}</span>
          </div>
          <div class="pay-tag">${paymentIcon(o.paymentMethod)} ${esc(o.paymentMethod||'Efectivo')}</div>
          <div class="ticket-actions">
            ${isDone ? '' : `<button class="btn btn-primary act-deliver" data-id="${o.id}">✓ Marcar entregado</button>`}
            <button class="btn btn-map act-maps" data-addr="${esc(o.address)}">🧭 Maps</button>
            <button class="btn btn-danger-ghost act-delete" data-id="${o.id}">🗑</button>
          </div>
        </div>
      </div>`;
  }

  function bindTicketActions(){
    document.querySelectorAll('.act-deliver').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const o = orders.find(x=>x.id===btn.dataset.id);
        if(!o) return;
        o.status = 'entregado';
        o.deliveredAt = new Date().toISOString();
        await saveOrders();
        showToast('Pedido marcado como entregado');
        renderAll();
      });
    });
    document.querySelectorAll('.act-delete').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('¿Eliminar este pedido? Esta acción no se puede deshacer.')) return;
        orders = orders.filter(x=>x.id!==btn.dataset.id);
        await saveOrders();
        showToast('Pedido eliminado');
        renderAll();
      });
    });
    document.querySelectorAll('.act-maps').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(btn.dataset.addr);
        window.open(url, '_blank');
      });
    });
  }

  /* ---------- RENDER: RUTAS TAB ---------- */
  function renderRutas(){
    const pending = orders.filter(o=>o.status==='pendiente')
      .sort((a,b)=> a.address.localeCompare(b.address, 'es', {sensitivity:'base'}));

    let html = '<div class="section-title"><h2>Ruta del día</h2><span class="count">' + pending.length + ' paradas</span></div>';

    if(pending.length===0){
      html += `<div class="empty"><span class="big">🗺️</span>No hay paradas pendientes.<br>Añade un pedido para generar la ruta.</div>`;
    } else {
      html += '<div class="route-list">';
      pending.forEach((o,idx)=>{
        const units = orderUnits(o);
        html += `
          <div class="route-stop">
            <div class="stop-num">${idx+1}</div>
            <div class="stop-card">
              <div class="stop-name">${esc(o.bakery)}</div>
              <div class="stop-addr">📍 ${esc(o.address)}</div>
              <div class="stop-meta">${units} pizza${units!==1?'s':''} · ${money(orderTotal(o))}</div>
              <div class="stop-actions">
                <button class="btn btn-map act-maps" style="flex:1;" data-addr="${esc(o.address)}">🧭 Abrir en Google Maps</button>
              </div>
            </div>
          </div>`;
      });
      html += '</div>';
    }
    $('#mainContent').innerHTML = html;
    bindTicketActions();
  }

  /* ---------- RENDER: HISTORIAL TAB ---------- */
  function renderHistorial(){
    const delivered = orders.filter(o=>o.status==='entregado')
      .sort((a,b)=> new Date(b.deliveredAt) - new Date(a.deliveredAt));

    const totalUnits = delivered.reduce((s,o)=>s+orderUnits(o),0);
    const totalRevenue = delivered.reduce((s,o)=>s+orderTotal(o),0);
    const bakeriesServed = new Set(delivered.map(o=>o.bakery)).size;

    const byType = {};
    delivered.forEach(o=> o.items.forEach(i=>{
      byType[i.tipo] = (byType[i.tipo]||0) + Number(i.unidades);
    }));
    const maxType = Math.max(1, ...Object.values(byType));
    const typeRows = Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([name,units])=> `
      <div class="tb-row">
        <div class="tb-name">${esc(name)}</div>
        <div class="tb-bar-wrap"><div class="tb-bar" style="width:${Math.max(6,(units/maxType)*100)}%"></div></div>
        <div class="tb-val">${units}</div>
      </div>`).join('');

    let html = `
      <div class="section-title"><h2>Resumen</h2></div>
      <div class="stats-grid">
        <div class="stat-card"><div class="n">${totalUnits}</div><div class="l">Pizzas vendidas</div></div>
        <div class="stat-card"><div class="n">${money(totalRevenue)}</div><div class="l">Ingresos totales</div></div>
        <div class="stat-card wide"><div class="n">${bakeriesServed}</div><div class="l">Panaderías servidas (histórico)</div></div>
      </div>
      ${Object.keys(byType).length ? `<div class="type-breakdown">${typeRows}</div>` : ''}
      <div class="section-title"><h2>Historial de entregas</h2></div>
      <div class="search-bar">
        <input type="text" id="histSearchInput" placeholder="🔎 Buscar panadería, dirección o pizza…" value="${esc(histSearch)}">
      </div>
      <div class="chip-row" id="paymentChips">
        ${['Todas', ...PAYMENT_METHODS.map(p=>p.name)].map(name=>`
          <button type="button" class="chip ${histPaymentFilter===name?'active':''}" data-pay="${esc(name)}">${name==='Todas'?'Todas':paymentIcon(name)+' '+name}</button>
        `).join('')}
      </div>
      <div id="histResults"></div>
    `;
    $('#mainContent').innerHTML = html;

    $('#histSearchInput').addEventListener('input', (e)=>{
      histSearch = e.target.value;
      updateHistResults();
    });
    document.querySelectorAll('#paymentChips .chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        histPaymentFilter = chip.dataset.pay;
        document.querySelectorAll('#paymentChips .chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        updateHistResults();
      });
    });
    updateHistResults();
  }

  function updateHistResults(){
    const delivered = orders.filter(o=>o.status==='entregado')
      .sort((a,b)=> new Date(b.deliveredAt) - new Date(a.deliveredAt));

    const q = histSearch.trim().toLowerCase();
    const filtered = delivered.filter(o=>{
      const matchesPay = histPaymentFilter==='Todas' || o.paymentMethod===histPaymentFilter;
      if(!matchesPay) return false;
      if(!q) return true;
      const haystack = [o.bakery, o.address, ...o.items.map(i=>i.tipo)].join(' ').toLowerCase();
      return haystack.includes(q);
    });

    const box = $('#histResults');
    if(delivered.length===0){
      box.innerHTML = `<div class="empty"><span class="big">📊</span>Aún no hay entregas registradas.</div>`;
      return;
    }
    if(filtered.length===0){
      box.innerHTML = `<div class="empty"><span class="big">🔎</span>Sin resultados para esta búsqueda.</div>`;
      return;
    }
    let html = '';
    if(q || histPaymentFilter!=='Todas'){
      html += `<div class="result-count">${filtered.length} venta${filtered.length!==1?'s':''} encontrada${filtered.length!==1?'s':''}</div>`;
    }
    const groups = {};
    filtered.forEach(o=>{
      const key = new Date(o.deliveredAt).toDateString();
      (groups[key] = groups[key]||[]).push(o);
    });
    Object.entries(groups).forEach(([key, list])=>{
      html += `<div class="day-group"><div class="day-label">${fmtDayLabel(list[0].deliveredAt)}</div>`;
      list.forEach(o=>{
        const itemsSummary = o.items.map(i=>`${i.unidades}× ${esc(i.tipo)}`).join(', ');
        html += `
          <div class="hist-card">
            <div class="hist-top">
              <span class="hist-name">${esc(o.bakery)}</span>
              <span class="hist-time">${fmtDate(o.deliveredAt)}</span>
            </div>
            <div class="hist-items">📍 ${esc(o.address)}</div>
            <div class="hist-items">${itemsSummary}</div>
            <div class="hist-bottom">
              <div class="pay-tag">${paymentIcon(o.paymentMethod)} ${esc(o.paymentMethod||'Efectivo')}</div>
              <div class="hist-total">${money(orderTotal(o))}</div>
            </div>
          </div>`;
      });
      html += `</div>`;
    });
    box.innerHTML = html;
  }

  function renderAll(){
    renderHeaderStats();
    if(currentTab==='pedidos') renderPedidos();
    else if(currentTab==='rutas') renderRutas();
    else if(currentTab==='historial') renderHistorial();
  }

  /* ---------- TABS ---------- */
  document.querySelectorAll('.nav-btn[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!btn.dataset.tab || btn.dataset.tab==='ajustes') return;
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  /* ---------- MODAL / NUEVO PEDIDO ---------- */
  function itemRowHtml(id){
    const options = PIZZA_TYPES.map(t=>`<option value="${t.name}" data-price="${t.price}">${t.name}</option>`).join('');
    return `
      <div class="item-editor-row" data-row="${id}">
        <div class="field" style="margin-bottom:0;">
          <label>Tipo</label>
          <select class="it-type">${options}</select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Uds.</label>
          <input type="number" class="it-units" min="1" value="1" required>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Precio</label>
          <input type="number" class="it-price" min="0" step="0.1" value="${PIZZA_TYPES[0].price}" required>
        </div>
        <button type="button" class="rm-item" title="Quitar">✕</button>
      </div>`;
  }

  function addItemRow(){
    itemRowCount++;
    const wrap = document.createElement('div');
    wrap.className = 'item-editor';
    wrap.dataset.editor = itemRowCount;
    wrap.innerHTML = itemRowHtml(itemRowCount);
    $('#itemsEditor').appendChild(wrap);
    const sel = wrap.querySelector('.it-type');
    const priceInput = wrap.querySelector('.it-price');
    sel.addEventListener('change', ()=>{
      const opt = sel.options[sel.selectedIndex];
      priceInput.value = opt.dataset.price;
    });
    wrap.querySelector('.rm-item').addEventListener('click', ()=>{
      if($('#itemsEditor').children.length > 1){ wrap.remove(); }
      else { showToast('El pedido necesita al menos una pizza'); }
    });
  }

  function resetForm(){
    $('#orderForm').reset();
    $('#itemsEditor').innerHTML = '';
    addItemRow();
    $('#fPayment').innerHTML = PAYMENT_METHODS.map(p=>`<option value="${p.name}">${p.icon} ${p.name}</option>`).join('');
  }

  function openModal(){
    resetForm();
    $('#modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){
    $('#modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  $('#openModalBtn').addEventListener('click', openModal);
  $('#cancelModalBtn').addEventListener('click', closeModal);
  $('#modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  $('#addItemBtn').addEventListener('click', addItemRow);

  $('#orderForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const bakery = $('#fBakery').value.trim();
    const address = $('#fAddress').value.trim();
    if(!bakery || !address) return;

    const items = [];
    document.querySelectorAll('#itemsEditor .item-editor').forEach(row=>{
      const tipo = row.querySelector('.it-type').value;
      const unidades = Number(row.querySelector('.it-units').value);
      const precio = Number(row.querySelector('.it-price').value);
      if(unidades>0) items.push({tipo, unidades, precio});
    });
    if(items.length===0){ showToast('Añade al menos una pizza al pedido'); return; }

    const paymentMethod = $('#fPayment').value || 'Efectivo';
    const newOrder = {
      id: uid(),
      bakery, address, items,
      paymentMethod,
      status: 'pendiente',
      createdAt: new Date().toISOString(),
      deliveredAt: null
    };
    orders.push(newOrder);
    await saveOrders();
    closeModal();
    showToast('Pedido guardado');
    currentTab = 'pedidos';
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('[data-tab="pedidos"]').classList.add('active');
    renderAll();
  });

  /* ---------- INIT ---------- */
  (async function init(){
    await loadOrders();
    renderAll();
    $('#loadingScreen').style.display = 'none';
  })();

})();
</script>
</body>
</html>
